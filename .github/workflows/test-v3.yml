# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: test_v3

on:
  push:
    branches:
    - "3.0"

  pull_request:
    branches:
    - "3.0"

  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: 'Run the build with tmate debugging enabled (https://github.com/marketplace/actions/debugging-with-tmate)'
        required: false
        default: false

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install coverage
        pip install git+https://github.com/populse/soma-base.git@pydantic_controller
        pip install git+https://github.com/populse/soma-workflow.git
        pip install git+https://github.com/populse/populse_db.git@3.0
        pip install .

    - name: Test with coverage
      run: |
        coverage run --branch -m capsul.test -vv

    - name: Generate coverage report
      if: always()
      run: |
        coverage xml -i

    - name: Upload coverage to Codecov
      if: always() && hashFiles('coverage.xml') != ''
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: true
        verbose: true

    # Enable tmate debugging of manually-triggered workflows if the input option was provided
    - name: Setup tmate session
      uses: mxschmitt/action-tmate@v3
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_enabled }}
      with:
        sudo: false
