#      rev: v0.17.5
#      hooks:
#          - id: ruff-check
#            # args: [--fix] # fear of automatically fix

    - repo: https://github.com/PyCQA/flake8
      rev: 7.5.0
      hooks:
        - id: flake8
          name: flake8 under python3
          language_version: python3
          exclude: '^(doc/|capsul/sphinxext/)'

