minimum_pre_commit_version: "4.6.2" # last version with Python >=3.10

repos:
    # General-purpose checks
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-case-conflict
          - id: check-executables-have-shebangs
          - id: check-merge-conflict
          - id: check-shebang-scripts-are-executable
          - id: check-symlinks
          - id: check-xml
          - id: check-yaml
            # FOM files have a .json extension but are YAML.
            types_or: [yaml, json]
          - id: debug-statements
          - id: destroyed-symlinks
          - id: end-of-file-fixer
          - id: fix-byte-order-marker
          - id: trailing-whitespace

# Currently (18/11/2026 ruf Found 2935 errors ...
# 1466 fixable with `--fix` and 1143 unsafe fixes available with `--fix --unsafe-fixes`.
# No time to correct it by hand right now... We'll stick with flake8 for now.
